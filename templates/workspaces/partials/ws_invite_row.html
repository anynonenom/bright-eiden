<div class="flex items-center gap-4 px-6 py-4" style="border-bottom: 1px solid var(--border);">
    <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0"
         style="background: var(--neutral-100);">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate" style="color: var(--text-primary);">{{ invite.email }}</p>
        <p class="text-xs" style="color: var(--text-tertiary);">
            Invited by {{ invite.invited_by.get_full_name|default:invite.invited_by.email }} &middot; expires {{ invite.expires_at|date:"M d" }}
        </p>
    </div>
    <span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background: var(--warning-50, #FEF3C7); color: var(--warning-700, #92400E);">Pending</span>
</div>
