<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — EIDEN GROUP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: #F4EBD0;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            background: #FEFDFB;
            border: 1px solid #D8CFBA;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 440px; width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(12,87,82,0.08);
        }
        .icon {
            width: 64px; height: 64px; margin: 0 auto 24px;
            background: #E8F4F3;
            border: 1.5px solid #9FCFCB;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        h1 {
            font-size: 1.5rem; font-weight: 700;
            color: #122620; letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.9375rem; color: #5C6B66;
            line-height: 1.65; margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: #0C5752; color: #FEFDFB;
            padding: 11px 28px;
            border-radius: 999px;
            font-size: 0.875rem; font-weight: 600;
            text-decoration: none;
            transition: background 150ms ease;
        }
        .btn:hover { background: #0E7A73; }
        .logo {
            font-size: 0.75rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: #9BB5AE; margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">EIDEN GROUP</div>
        <div class="icon">
            <svg width="28" height="28" fill="none" stroke="#0C5752" viewBox="0 0 24 24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
        </div>
        <h1>Access Denied</h1>
        <p>You don't have permission to access this page. Contact your workspace admin if you need access.</p>
        <a href="javascript:history.back()" class="btn">Go Back</a>
    </div>
</body>
</html>
